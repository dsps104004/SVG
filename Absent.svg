<svg xmlns="http://w3.org" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- 使用遮罩將斜線兩側切出乾淨的間隙，還原圖示的斷開視覺效果 -->
    <mask id="slash-gap">
      <rect width="512" height="512" fill="white" />
      <line x1="162" y1="420" x2="350" y2="92" stroke="black" stroke-width="64" stroke-linecap="butt" />
    </mask>
  </defs>

  <!-- 中央圓環與左右箭頭（套用遮罩以切出斜線間隙） -->
  <g fill="none" stroke="#FFFFFF" stroke-width="38" mask="url(#slash-gap)">
    <!-- 中央圓環 -->
    <circle cx="256" cy="256" r="118" />
    
    <!-- 左側箭身 -->
    <line x1="138" y1="256" x2="72" y2="256" />
    
    <!-- 右側箭身 -->
    <line x1="374" y1="256" x2="440" y2="256" />
  </g>

  <!-- 左箭頭 -->
  <polygon points="18,256 86,204 86,308" fill="#FFFFFF" />

  <!-- 右箭頭 -->
  <polygon points="494,256 426,204 426,308" fill="#FFFFFF" />

  <!-- 貫穿中央的純白斜線 -->
  <line x1="162" y1="420" x2="350" y2="92" stroke="#FFFFFF" stroke-width="34" stroke-linecap="butt" />
</svg>
